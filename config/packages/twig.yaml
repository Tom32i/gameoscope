twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/theme.html.twig']
    date:
        timezone: "Europe/Paris"
    globals:
        google_analytics_token: "%env(GOOGLE_ANALYTICS_TOKEN)%"
        plausible_link: "https://analytics.tom32i.fr/js/%env(PLAUSIBLE_TAG)%"

when@test:
    twig:
        strict_variables: true
